name: Compile C Programs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux build (Makefile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile all programs
        run: make clean all CFLAGS="-std=c11 -Wall -Wextra -pedantic"

  build-windows:
    name: Windows build (PowerShell)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile all programs
        shell: pwsh
        run: ./scripts/compile_all.ps1

  sanitize-linux:
    name: Linux sanitizer build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile with sanitizers
        run: make sanitize
